app-id: com.stacksyncsolutions.PDFinity
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: pdfinity

finish-args:
  # Wayland & X11 display server access
  - --socket=wayland
  - --socket=fallback-x11
  # Shared IPC and printing support
  - --share=ipc
  - --socket=cups
  # XDG Desktop Portal & sandboxed filesystem access
  - --filesystem=xdg-documents:rw
  - --filesystem=xdg-download:rw
  - --filesystem=host:ro
  # Localhost networking for optional local MCP stdio & Remote Controller
  - --share=network
  # XDG Desktop Portal communication for native file dialogs and print dialogues
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Print
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: pdfinity
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ../../../
    post-install:
      - install -Dm644 packaging/linux/com.stacksyncsolutions.pdfinity.desktop /app/share/applications/com.stacksyncsolutions.PDFinity.desktop
      - install -Dm644 packaging/resources/pdfinity.svg /app/share/icons/hicolor/scalable/apps/com.stacksyncsolutions.PDFinity.svg
      - install -Dm644 packaging/resources/pdfinity.svg /app/share/icons/hicolor/scalable/apps/pdfinity.svg
      - install -Dm644 packaging/linux/com.stacksyncsolutions.pdfinity.metainfo.xml /app/share/metainfo/com.stacksyncsolutions.PDFinity.metainfo.xml
