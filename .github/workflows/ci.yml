name: PDFinity Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: Release Pipeline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate current version mapping
        run: python3 scripts/release_versions.py
      - name: Run release safety regression checks
        run: python3 -m unittest discover -s tests/pipeline -v
  build-windows:
    name: Windows x64 (MSVC + Qt 6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'

      - name: Provision PDFium Binaries
        run: python scripts/download_pdfium.py --platform win

      - name: Configure CMake
        run: |
          cmake --preset windows-x64-release

      - name: Build
        run: |
          cmake --build --preset windows-x64-release

      - name: Run Tests
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-x64-release --output-on-failure

      - name: Validate Windows Packaging
        run: |
          python scripts/package_windows.py --skip-installer

  build-linux:
    name: Linux x64 (GCC + Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake \
            desktop-file-utils appstream xvfb libgl1-mesa-dev libxkbcommon-dev libcups2-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'

      - name: Validate Desktop and AppStream Metadata
        run: |
          desktop-file-validate packaging/linux/pdfinity.desktop
          desktop-file-validate packaging/linux/com.stacksyncsolutions.pdfinity.desktop
          appstreamcli validate packaging/linux/flatpak/com.stacksyncsolutions.pdfinity.metainfo.xml

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform linux

      - name: Configure CMake
        run: |
          cmake --preset linux-x64-release

      - name: Build
        run: |
          cmake --build --preset linux-x64-release

      - name: Run Tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a ctest --preset linux-x64-release --output-on-failure

      - name: Validate Linux Packaging Scripts
        run: |
          chmod +x packaging/linux/*.sh packaging/linux/rpm/*.sh packaging/linux/appimage/*.sh
          ./packaging/linux/tarball.sh build/linux-x64-release "$(python3 scripts/release_versions.py --print)"

  build-macos:
    name: macOS (Apple Clang + Qt 6)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'clang_64'

      - name: Patch Qt 6 for macOS SDK AGL Framework Deprecation
        run: |
          find "${Qt6_DIR}" -type f \( -name "*.cmake" -o -name "*.prl" -o -name "*.conf" \) -exec sed -i '' 's/-framework AGL//g' {} +
          find "${Qt6_DIR}" -type f -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/"AGL"//g; s/AGL//g' {} +

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform mac

      - name: Configure CMake
        run: |
          cmake --preset macos-release
          find build/macos-release -type f \( -name "build.ninja" -o -name "*.cmake" \) -exec sed -i '' 's/-framework AGL//g' {} +

      - name: Build
        run: |
          cmake --build --preset macos-release

      - name: Run Tests
        run: |
          QT_QPA_PLATFORM=offscreen ctest --preset macos-release --output-on-failure

      - name: Validate macOS Packaging
        run: |
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh build/macos-release "$(python3 scripts/release_versions.py --print)"

  build-android:
    name: Android Verification (Gradle + C++20 NDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Validate Android Project Structure
        run: |
          test -f android/AndroidManifest.xml
          test -f android/build.gradle
          test -f android/src/com/stacksyncsolutions/pdfinity/PDFinityActivity.java
          chmod +x packaging/android/build_apk.sh
