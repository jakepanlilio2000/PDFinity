app-id: com.stacksyncsolutions.pdfinity
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: pdfinity

finish-args:
  # X11 + Wayland rendering
  - --socket=fallback-x11
  - --socket=wayland
  # Audio / Printing / IPC
  - --share=ipc
  - --socket=cups
  # Filesystem access for documents
  - --filesystem=host:ro
  - --filesystem=xdg-documents:rw
  - --filesystem=xdg-download:rw
  # Network strictly for local loopback (Local MCP / Remote Controller)
  - --share=network

modules:
  - name: pdfinity
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ../../../
    post-install:
      - install -Dm644 packaging/linux/pdfinity.desktop /app/share/applications/com.stacksyncsolutions.pdfinity.desktop
      - install -Dm644 packaging/resources/pdfinity.svg /app/share/icons/hicolor/scalable/apps/com.stacksyncsolutions.pdfinity.svg
      - install -Dm644 packaging/linux/flatpak/com.stacksyncsolutions.pdfinity.metainfo.xml /app/share/metainfo/com.stacksyncsolutions.pdfinity.metainfo.xml
