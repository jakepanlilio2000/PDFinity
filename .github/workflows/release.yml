name: PDFinity Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing merged stable tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_sha:
        description: Full immutable commit SHA (must match workflow source and tag)
        required: true
        type: string
      mode:
        description: Rehearsal never creates, edits or publishes a release
        required: true
        default: rehearsal
        type: choice
        options: [rehearsal, release]

permissions:
  contents: read
  actions: read

concurrency:
  group: pdfinity-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify merged tag, source, versions and required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release identity (no tag or release writes)
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          MODE: ${{ inputs.mode || 'release' }}
        run: |
          args=()
          if [ "$MODE" = rehearsal ]; then args+=(--rehearsal); fi
          python3 scripts/release_gate.py preflight --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" "${args[@]}"
      - name: Run deterministic gate and version regression checks
        run: python3 -m unittest discover -s tests/pipeline -v
      - name: Prove missing packages reject without publication
        if: inputs.mode == 'rehearsal'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          mkdir rehearsal-empty
          if python3 scripts/release_assets.py --directory rehearsal-empty --version "$VERSION" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"; then
            echo 'ERROR: missing assets were accepted'
            exit 1
          fi

  build-windows:
    needs: preflight
    if: inputs.mode != 'rehearsal'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: Windows x64 Build & Package
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'

      - name: Provision PDFium Binaries
        run: python scripts/download_pdfium.py --platform win

      - name: Configure CMake
        run: cmake --preset windows-x64-release

      - name: Build PDFinity
        run: cmake --build --preset windows-x64-release

      - name: Run CTest Suite
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-x64-release --output-on-failure

      - name: Package Windows Artifacts (Portable ZIP & Staging)
        run: python scripts/package_windows.py --version "$env:RELEASE_VERSION"

      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/windows.json --lane windows
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload windows zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-windows-x86_64-zip
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-windows-x86_64-installer
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload windows verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-windows-x86_64-receipt
          path: release-export/windows.json
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: preflight
    if: inputs.mode != 'rehearsal'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: Linux Multi-Distribution Packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Install System Toolchain & Distro Packagers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xvfb rpm dpkg-dev libgl1-mesa-dev libxkbcommon-dev libcups2-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform linux

      - name: Configure CMake
        run: cmake --preset linux-x64-release

      - name: Build PDFinity
        run: cmake --build --preset linux-x64-release

      - name: Run CTest Suite under Xvfb
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a ctest --preset linux-x64-release --output-on-failure

      - name: Package Debian (.deb)
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/linux/build_deb.sh build/linux-x64-release "${TAG_VER:-1.1.0}" amd64

      - name: Package Red Hat / Fedora (.rpm)
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/linux/rpm/build_rpm.sh "${TAG_VER:-1.1.0}"

      - name: Package Portable AppImage
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/linux/appimage/build-appimage.sh build/linux-x64-release "${TAG_VER:-1.1.0}"

      - name: Verify Arch Linux PKGBUILD & .SRCINFO
        run: |
          cd packaging/linux/arch
          test -f PKGBUILD && test -f .SRCINFO
          echo "[+] Arch Linux PKGBUILD and .SRCINFO verified."

      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/linux.json --lane linux
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload linux deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-deb
          path: release-export/pdfinity_${{ needs.preflight.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload linux rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-rpm
          path: release-export/pdfinity-${{ needs.preflight.outputs.version }}-1.x86_64.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Upload linux appimage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-appimage
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Upload linux verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-receipt
          path: release-export/linux.json
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: preflight
    if: inputs.mode != 'rehearsal'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: macOS Universal DMG Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'clang_64'

      - name: Patch Qt 6 for macOS SDK AGL Framework Deprecation
        run: |
          find "${Qt6_DIR}" -type f \( -name "*.cmake" -o -name "*.prl" -o -name "*.conf" \) -exec sed -i '' 's/-framework AGL//g' {} + || true
          find "${Qt6_DIR}" -type f -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/"AGL"//g; s/AGL//g' {} + || true

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform mac

      - name: Configure CMake
        run: |
          cmake --preset macos-release
          find build/macos-release -type f \( -name "build.ninja" -o -name "*.cmake" \) -exec sed -i '' 's/-framework AGL//g' {} + || true

      - name: Build PDFinity
        run: cmake --build --preset macos-release

      - name: Run CTest Suite
        run: QT_QPA_PLATFORM=offscreen ctest --preset macos-release --output-on-failure

      - name: Package DMG Disk Image
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/macos/build_dmg.sh build/macos-release "${TAG_VER:-1.1.0}"

      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/macos.json --lane macos
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload macos dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-macos-universal-dmg
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-macOS.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload macos verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-macos-universal-receipt
          path: release-export/macos.json
          if-no-files-found: error
          retention-days: 14

  build-android:
    needs: preflight
    if: inputs.mode != 'rehearsal'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: Android APK & AAB Packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Build Android Packages (APK & AAB)
        run: |
          chmod +x packaging/android/build_apk.sh
          ./packaging/android/build_apk.sh Release

      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/android.json --lane android
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload android apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-android-universal-apk
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-android-universal-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload android aab
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-android-universal-aab
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-android-universal-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload android verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-android-universal-receipt
          path: release-export/android.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Consolidate, draft, verify downloads and publish
    needs: [preflight, build-windows, build-linux, build-macos, build-android]
    if: inputs.mode != 'rehearsal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download all build artifacts without flattening
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pdfinity-${{ needs.preflight.outputs.version }}-*
          path: release-input/
          merge-multiple: false
      - name: Validate entire contract, upload draft, verify, then promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: >-
          python3 scripts/release_gate.py transaction --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          --directory release-input --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
