name: PDFinity Multi-Platform Release
run-name: PDFinity ${{ inputs.release_tag || github.ref_name }} ${{ inputs.mode || 'release' }} ${{ inputs.probe_parent }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing merged stable tag for release/rehearsal; unused for native qualification
        required: false
        type: string
      source_sha:
        description: Full immutable commit SHA (must match workflow source and tag)
        required: true
        type: string
      probe_parent:
        description: Internal GITHUB_TOKEN dispatch probe parent run (leave empty)
        required: false
        default: ''
        type: string
      mode:
        description: Rehearsal never creates, edits or publishes a release
        required: true
        default: rehearsal
        type: choice
        options: [rehearsal, verify-deb, verify-rpm, verify-pdfium-rpm, release]

permissions:
  contents: read
  actions: read

concurrency:
  group: pdfinity-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify merged tag, source, versions and required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the native verifier's minimum Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check release identity (no tag or release writes)
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          MODE: ${{ inputs.mode || 'release' }}
        run: |
          if [ "$MODE" = verify-deb ] || [ "$MODE" = verify-rpm ] || [ "$MODE" = verify-pdfium-rpm ]; then
            python3 scripts/release_gate.py qualify --sha "$SOURCE_SHA"
          else
            args=()
            if [ "$MODE" = rehearsal ]; then args+=(--rehearsal); fi
            python3 scripts/release_gate.py preflight --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" "${args[@]}"
          fi
      - name: Run deterministic gate and version regression checks
        run: python3 -m unittest discover -s tests/pipeline -v
      - name: Prove missing packages reject without publication
        if: inputs.mode == 'rehearsal'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          mkdir rehearsal-empty
          if python3 scripts/release_assets.py --directory rehearsal-empty --version "$VERSION" --sha "$SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"; then
            echo 'ERROR: missing assets were accepted'
            exit 1
          fi

  build-pdfium-rpm-dependency:
    name: Rehearse exact-source RPM-compatible PDFium dependency
    needs: preflight
    if: inputs.mode == 'verify-pdfium-rpm'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Build immutable source with pinned recipe and tool bootstrap
        run: |
          test ! -e build/pdfium-rpm-source
          mkdir -p build/pdfium-rpm-source
          image=$(python3 -c 'import json; print(json.load(open("packaging/linux/rpm/pdfium-source.json"))["image"])')
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          docker run --rm --platform linux/amd64 \
            --env PDFINITY_RECIPE_SHA=${{ needs.preflight.outputs.sha }} \
            --env PDFINITY_RUN_ID="$GITHUB_RUN_ID" --env PDFINITY_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            --mount "type=bind,src=$PWD/build/pdfium-rpm-source,dst=/work" \
            --mount "type=bind,src=$PWD/scripts,dst=/checks,readonly" \
            --mount "type=bind,src=$PWD/packaging/linux/rpm/pdfium-source.json,dst=/input/source-lock.json,readonly" \
            --mount "type=bind,src=$PWD/third_party/pdfium/dependency-lock.json,dst=/input/binary-lock.json,readonly" \
            "$image" bash /checks/build_pdfium_rpm_source.sh
      - name: Retain source-built dependency rehearsal and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-pdfium-159.0.8152.0-linux-x86_64-rpm-dependency-${{ needs.preflight.outputs.sha }}
          path: build/pdfium-rpm-source/output/*
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: preflight
    if: github.event_name == 'push' || inputs.mode == 'release'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: Windows x64 Build & Package
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'

      - name: Provision PDFium Binaries
        run: python scripts/download_pdfium.py --platform win

      - name: Configure CMake
        run: cmake --preset windows-x64-release

      - name: Build PDFinity
        run: cmake --build --preset windows-x64-release

      - name: Run CTest Suite
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-x64-release --output-on-failure

      - name: Package Windows Artifacts (Portable ZIP & Staging)
        run: python scripts/package_windows.py --version "$env:RELEASE_VERSION"

      - name: Verify native install, runtime, version and removal
        shell: bash
        run: >-
          python3 scripts/verify_native_packages.py --lane windows
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/windows.json --lane windows
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload windows zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-windows-x86_64-zip
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-windows-x86_64-installer
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload windows verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-windows-x86_64-receipt
          path: release-export/windows.json
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: preflight
    if: inputs.mode != 'rehearsal' && inputs.mode != 'verify-pdfium-rpm'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: Linux Multi-Distribution Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Install System Toolchain & Distro Packagers
        if: inputs.mode != 'verify-rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build xvfb xauth rpm dpkg-dev qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins libgl1-mesa-dev libxkbcommon-dev libcups2-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0

      - name: Use Python 3.11 with native distribution Qt
        if: inputs.mode != 'verify-rpm'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Provision PDFium Binaries
        if: inputs.mode != 'verify-rpm'
        run: python3 scripts/download_pdfium.py --platform linux

      - name: Configure CMake
        if: inputs.mode != 'verify-rpm'
        run: cmake --preset linux-x64-release

      - name: Build PDFinity
        if: inputs.mode != 'verify-rpm'
        run: cmake --build --preset linux-x64-release

      - name: Run CTest Suite under Xvfb
        if: inputs.mode != 'verify-rpm'
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a ctest --preset linux-x64-release --output-on-failure

      - name: Package Debian (.deb)
        if: inputs.mode != 'verify-rpm'
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/linux/build_deb.sh build/linux-x64-release "${TAG_VER:-1.1.0}" amd64

      - name: Package Red Hat / Fedora (.rpm)
        if: inputs.mode != 'verify-deb'
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/linux/rpm/build_rpm.sh "${TAG_VER:-1.1.0}"

      - name: Package Portable AppImage
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/linux/appimage/build-appimage.sh build/linux-x64-release "${TAG_VER:-1.1.0}"

      - name: Verify Arch Linux PKGBUILD & .SRCINFO
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        run: |
          cd packaging/linux/arch
          test -f PKGBUILD && test -f .SRCINFO
          echo "[+] Arch Linux PKGBUILD and .SRCINFO verified."

      - name: Verify native install, runtime, version and removal
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        shell: bash
        run: >-
          python3 scripts/verify_native_packages.py --lane linux
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Validate native package evidence and export only contracted assets
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/linux.json --lane linux
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload linux deb
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-deb
          path: release-export/pdfinity_${{ needs.preflight.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload linux rpm
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-rpm
          path: release-export/pdfinity-${{ needs.preflight.outputs.version }}-1.x86_64.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Upload linux appimage
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-appimage
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Upload linux verification receipt
        if: inputs.mode != 'verify-deb' && inputs.mode != 'verify-rpm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-linux-x86_64-receipt
          path: release-export/linux.json
          if-no-files-found: error
          retention-days: 14

      - name: Qualify only the unreleased DEB with native install and removal
        if: inputs.mode == 'verify-deb'
        run: >-
          python3 scripts/verify_native_packages.py --lane linux --package-type deb
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Retain qualified development DEB and scoped evidence
        if: inputs.mode == 'verify-deb'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-deb-${{ needs.preflight.outputs.sha }}-linux-x86_64
          path: |
            dist/pdfinity_${{ needs.preflight.outputs.version }}_amd64.deb
            verification/receipts/linux-deb.json
          if-no-files-found: error
          retention-days: 14

      - name: Qualify only the unreleased RPM with offline PDF workflows
        if: inputs.mode == 'verify-rpm'
        run: >-
          python3 scripts/verify_native_packages.py --lane linux --package-type rpm
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Retain qualified development RPM and scoped evidence
        if: inputs.mode == 'verify-rpm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-rpm-${{ needs.preflight.outputs.sha }}-linux-x86_64
          path: |
            dist/pdfinity-${{ needs.preflight.outputs.version }}-1.x86_64.rpm
            verification/receipts/linux-rpm.json
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: preflight
    if: github.event_name == 'push' || inputs.mode == 'release'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: macOS Universal DMG Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
        with:
          version: '6.8.2'
          arch: 'clang_64'

      - name: Patch Qt 6 for macOS SDK AGL Framework Deprecation
        run: |
          find "${Qt6_DIR}" -type f \( -name "*.cmake" -o -name "*.prl" -o -name "*.conf" \) -exec sed -i '' 's/-framework AGL//g' {} +
          find "${Qt6_DIR}" -type f -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/"AGL"//g; s/AGL//g' {} +

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform mac

      - name: Configure CMake
        run: |
          cmake --preset macos-release
          find build/macos-release -type f \( -name "build.ninja" -o -name "*.cmake" \) -exec sed -i '' 's/-framework AGL//g' {} +

      - name: Build PDFinity
        run: cmake --build --preset macos-release

      - name: Run CTest Suite
        run: QT_QPA_PLATFORM=offscreen ctest --preset macos-release --output-on-failure

      - name: Package DMG Disk Image
        run: |
          TAG_VER="$RELEASE_VERSION"
          bash packaging/macos/build_dmg.sh build/macos-release "${TAG_VER:-1.1.0}"

      - name: Verify native install, runtime, version and removal
        shell: bash
        run: >-
          python3 scripts/verify_native_packages.py --lane macos
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/macos.json --lane macos
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload macos dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-macos-universal-dmg
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-macOS.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload macos verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-macos-universal-receipt
          path: release-export/macos.json
          if-no-files-found: error
          retention-days: 14

  build-android:
    needs: preflight
    if: github.event_name == 'push' || inputs.mode == 'release'
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
    name: Android APK & AAB Packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Build Android Packages (APK & AAB)
        run: |
          chmod +x packaging/android/build_apk.sh
          ./packaging/android/build_apk.sh Release

      - name: Verify native install, runtime, version and removal
        shell: bash
        run: >-
          python3 scripts/verify_native_packages.py --lane android
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
      - name: Validate native package evidence and export only contracted assets
        shell: bash
        run: >-
          python3 scripts/release_assets.py --stage-from dist --directory release-export
          --receipt verification/receipts/android.json --lane android
          --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload android apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-android-universal-apk
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-android-universal-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload android aab
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-android-universal-aab
          path: release-export/PDFinity-${{ needs.preflight.outputs.version }}-android-universal-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload android verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfinity-${{ needs.preflight.outputs.version }}-android-universal-receipt
          path: release-export/android.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Consolidate, draft, verify downloads and publish
    needs: [preflight, build-windows, build-linux, build-macos, build-android]
    if: >-
      always() && needs.preflight.result == 'success' &&
      (inputs.mode == 'rehearsal' ||
      ((github.event_name == 'push' || inputs.mode == 'release') &&
      needs.build-windows.result == 'success' && needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' && needs.build-android.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: write # Only this publishing job can explicitly dispatch the no-write probe.
    steps:
      - name: Prove repository GITHUB_TOKEN explicitly triggers a safe workflow
        if: inputs.mode == 'rehearsal' && inputs.probe_parent == ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: >-
          gh workflow run release.yml --repo jakepanlilio2000/PDFinity --ref "$WORKFLOW_REF"
          --field release_tag="$RELEASE_TAG" --field source_sha="$RELEASE_SHA"
          --field mode=rehearsal --field probe_parent="$GITHUB_RUN_ID"
      - name: Record child probe completion
        if: inputs.mode == 'rehearsal' && inputs.probe_parent != ''
        env:
          PARENT_RUN: ${{ inputs.probe_parent }}
        run: echo "GITHUB_TOKEN workflow_dispatch child executed; parent=$PARENT_RUN; no release writes."
      - name: Checkout verified release source
        if: inputs.mode != 'rehearsal' && inputs.mode != 'verify-pdfium-rpm'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download all build artifacts without flattening
        if: inputs.mode != 'rehearsal' && inputs.mode != 'verify-pdfium-rpm'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pdfinity-${{ needs.preflight.outputs.version }}-*
          path: release-input/
          merge-multiple: false
      - name: Validate entire contract, upload draft, verify, then promote
        if: inputs.mode != 'rehearsal' && inputs.mode != 'verify-pdfium-rpm'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: >-
          python3 scripts/release_gate.py transaction --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
          --directory release-input --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
