name: PDFinity Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Build & Package
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'

      - name: Provision PDFium Binaries
        run: python scripts/download_pdfium.py --platform win

      - name: Configure CMake
        run: cmake --preset windows-x64-release

      - name: Build PDFinity
        run: cmake --build --preset windows-x64-release

      - name: Run CTest Suite
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-x64-release --output-on-failure

      - name: Package Windows Artifacts (Portable ZIP & Staging)
        run: python scripts/package_windows.py --skip-installer

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/*

  build-linux:
    name: Linux Multi-Distribution Packages
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Toolchain & Distro Packagers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build xvfb rpm dpkg-dev libgl1-mesa-dev libxkbcommon-dev libcups2-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          arch: 'linux_gcc_64'

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform linux

      - name: Configure CMake
        run: cmake --preset linux-x64-release

      - name: Build PDFinity
        run: cmake --build --preset linux-x64-release

      - name: Run CTest Suite under Xvfb
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a ctest --preset linux-x64-release --output-on-failure

      - name: Package Debian (.deb)
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          bash packaging/linux/build_deb.sh build/linux-x64-release "${TAG_VER:-1.1.0}" amd64

      - name: Package Red Hat / Fedora (.rpm)
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          bash packaging/linux/rpm/build_rpm.sh "${TAG_VER:-1.1.0}"

      - name: Package Portable AppImage
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          bash packaging/linux/appimage/build-appimage.sh build/linux-x64-release "${TAG_VER:-1.1.0}"

      - name: Verify Arch Linux PKGBUILD & .SRCINFO
        run: |
          cd packaging/linux/arch
          test -f PKGBUILD && test -f .SRCINFO
          echo "[+] Arch Linux PKGBUILD and .SRCINFO verified."

      - name: Ensure Staged Release Artifacts Fallback
        run: python3 scripts/prepare_release_artifacts.py "${GITHUB_REF_NAME#v}" || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  build-macos:
    name: macOS Universal DMG Bundle
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Setup Qt 6.8 LTS
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          arch: 'clang_64'

      - name: Provision PDFium Binaries
        run: python3 scripts/download_pdfium.py --platform mac

      - name: Configure CMake
        run: cmake --preset macos-release

      - name: Build PDFinity
        run: cmake --build --preset macos-release

      - name: Run CTest Suite
        run: QT_QPA_PLATFORM=offscreen ctest --preset macos-release --output-on-failure

      - name: Package DMG Disk Image
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          bash packaging/macos/build_dmg.sh build/macos-release "${TAG_VER:-1.1.0}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: dist/*.dmg

  build-android:
    name: Android APK & AAB Packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Build Android Packages (APK & AAB)
        run: |
          chmod +x packaging/android/build_apk.sh
          ./packaging/android/build_apk.sh Release || true
          python3 scripts/prepare_release_artifacts.py "${GITHUB_REF_NAME#v}" || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            android/build/outputs/apk/**/*.apk
            dist/*.apk
          if-no-files-found: ignore

  publish-release:
    name: Consolidate & Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-dist/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: release-dist/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: release-dist/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: release-dist/
        continue-on-error: true

      - name: Generate Cryptographic Checksums (SHA-256)
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
            docs/SBOM.md
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
