<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- App Icon Background: Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <!-- Folded Page Corner Accent -->
  <path d="M 360 32 L 480 152 L 360 152 Z" fill="#b91c1c" opacity="0.4" />
  <!-- Stylized Infinity Loop Representing PDFinity -->
  <path d="M 180 200 C 130 200 90 230 90 270 C 90 310 130 340 180 340 C 225 340 256 300 280 270 C 304 240 335 200 380 200 C 430 200 470 230 470 270 C 470 310 430 340 380 340 C 335 340 304 300 280 270 C 256 240 225 200 180 200 Z" 
        fill="none" stroke="url(#infGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Document Fold Notch -->
  <line x1="280" y1="230" x2="280" y2="310" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
</svg>
